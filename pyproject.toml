[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whole-body-jepa-research"
version = "0.1.0"
description = "Research-only whole-body factual forecasting runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.0,<3",
  "torch>=2.2",
  "scikit-learn==1.7.2",
  "scipy>=1.12",
  "joblib>=1.3",
  "pyarrow>=15",
  "duckdb>=1.0",
  "wfdb>=4.1,<5",
  "vitaldb==1.7.2",
]

[project.scripts]
whole-body-predict = "scripts.predict_patient:main"
whole-body-contract = "scripts.show_contract:main"
whole-body-validate = "scripts.validate_release:main"
whole-body-lockbox = "scripts.validate_external_lockbox:main"

[tool.setuptools]
py-modules = [
  "whole_body_joint_jepa",
  "whole_body_joint_source_registry",
  "nonlinear_latent_rollout",
]

[tool.setuptools.packages.find]
include = ["whole_body_jepa*", "osler_jepa*", "extractors*", "scripts*"]
