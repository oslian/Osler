# Runs the demo's tests and the forecast API's tests on every push to main and on every pull request.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo:
    name: demo (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]          # the oldest version pyproject.toml allows, and the one development uses
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: demo/requirements.txt
      - uses: actions/setup-node@v4       # the chart and idle-timer tests run the page's scripts under Node
        with:
          node-version: 22
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
        env:
          PYTHONPATH: backend

  api:
    name: forecast API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest test_osler_api test_adaptive_cell_weights
